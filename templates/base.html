<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root{
                --bg: linear-gradient(180deg, #e7eeff 0%, #d6e2ff 100%);
                --card: #FFFFFF;
                --nav: #FFFFFF;
                --primary: #1E3A8A;
                --button: #2563EB;
                --button-hover: #1D4ED8;
                --text-main: #1F2937;
                --text-secondary: #6B7280;
                --borders: #D6E4FF;
            }
            /* Shared simple styles used across templates */
            body { font-family: 'Poppins', Arial, sans-serif; color:var(--text-main); background:var(--bg); }
            .container { max-width:1200px; margin:0 auto; padding:0 18px; }
            main { padding:28px 0; }
            .section { padding:36px 0; }
            .btn { display:inline-block; padding:12px 16px; border-radius:10px; text-decoration:none; font-weight:600; font-size:0.95rem; }
            .btn-primary { background:var(--button); color:#fff; }
            .btn-primary:hover { background:var(--button-hover); }
            .card { border:1px solid var(--borders); outline:1px solid rgba(31,41,55,0.08); outline-offset:-1px; background:var(--card); border-radius:14px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
            header nav a { text-decoration:none; }
        </style>
        {% block head %}{% endblock %}
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--text-main);">
    <header style="position:sticky;top:0;z-index:1000;background:var(--nav);border-bottom:1px solid var(--borders);">
        <nav style="max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;min-height:72px;">
            <a href="{% url 'home' %}" style="font-weight:700;color:var(--primary);font-size:1.25rem;letter-spacing:0.02em;text-decoration:none;">My Portfolio</a>
            <div style="display:flex;align-items:center;gap:16px;">
                <a href="{% url 'home' %}" style="color:var(--primary);font-size:0.98rem;text-decoration:none;">Home</a>
                <a href="{% url 'about' %}" style="color:var(--primary);font-size:0.98rem;text-decoration:none;">About</a>
                <a href="{% url 'projects' %}" style="color:var(--primary);font-size:0.98rem;text-decoration:none;">Projects</a>
                <a href="{% url 'testimony_list' %}" style="color:var(--primary);font-size:0.98rem;text-decoration:none;">Testimonies</a>
                <a href="{% url 'contact' %}" style="color:var(--primary);font-size:0.98rem;text-decoration:none;">Contact</a>
                <a href="{% url 'testimony_create' %}" style="padding:8px 12px;border-radius:999px;background:var(--button);color:#fff;text-decoration:none;font-weight:600;font-size:0.92rem;">Leave Testimony</a>
            </div>
        </nav>
    </header>

    <main style="max-width:1150px;margin:32px auto;padding:0 18px;flex:1;">
        {% block content %}{% endblock %}
    </main>

    <footer style="max-width:1150px;margin:24px auto;padding:22px 18px;color:var(--text-secondary);font-size:0.95rem;background:var(--bg);border-top:1px solid var(--borders);">
        <p style="margin:0;text-align:center;">Jack John Kippen • Computer Engineering Student • Built with Django • © 2026</p>
    </footer>
</body>
</html>
