{% extends 'base.html' %}
{% block title %}Contact — Student Portfolio{% endblock %}
{% block head %}
<style>
  body{font-family:'Poppins', Arial, sans-serif;color:var(--text-main);background:var(--bg)}
  .card{border:1px solid var(--borders);padding:28px;border-radius:14px;background:var(--card);max-width:760px;margin:18px auto}
  label{display:block;margin-bottom:6px;font-weight:600}
  input, textarea{width:100%;padding:10px;border:1px solid var(--borders);border-radius:8px;margin-bottom:12px;font-family:'Poppins',Arial,sans-serif}
  .btn{display:inline-block;padding:10px 18px;border:1px solid var(--button);border-radius:999px;background:var(--button);color:#fff;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--button-hover)}
</style>
{% endblock %}

{% block content %}
<div class="card">
  <h1 style="color:var(--primary);margin-bottom:12px">Contact / Inquiry</h1>
  <p style="color:var(--text-secondary);margin-bottom:14px">Send an inquiry and I'll get back to you.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Send Inquiry</button>
  </form>
</div>
{% endblock %}
