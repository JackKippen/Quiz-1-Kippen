{% extends 'base.html' %}
{% block title %}Logout{% endblock %}

{% block content %}
<div style="max-width:520px;margin:40px auto;padding:30px;border:1px solid var(--borders);background:var(--card);border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,0.05);text-align:center;">
  <h1 style="color:var(--primary);margin-bottom:12px;">Logout</h1>
  <p style="color:var(--text-secondary);margin-bottom:24px;line-height:1.7;">
    Are you sure you want to sign out of your account?
  </p>

  <form method="post">
    {% csrf_token %}
    <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
      <button type="submit" style="display:inline-block;padding:12px 20px;border-radius:999px;border:none;background:var(--button);color:#fff;font-weight:600;cursor:pointer;">Yes, Logout</button>
      <a href="{% url 'home' %}" style="display:inline-block;padding:12px 20px;border-radius:999px;border:1px solid var(--borders);background:transparent;color:var(--primary);text-decoration:none;font-weight:600;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
